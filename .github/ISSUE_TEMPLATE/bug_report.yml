name: Bug report
description: Something doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check [TROUBLESHOOTING.md](https://github.com/GamenHaaDee/Spotischerm/blob/main/TROUBLESHOOTING.md) first; many problems (black screen, touch, Spotify errors) are described there.
        You may write in English, Nederlands or Deutsch.

  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true

  - type: dropdown
    id: pi
    attributes:
      label: Raspberry Pi model
      options:
        - Pi 1 (A, A+, B, B+)
        - Pi Zero / Zero W
        - Pi Zero 2 W
        - Pi 2B
        - Pi 3B / 3B+ / 3A+
        - Pi 4
        - Pi 5
        - PC (Windows / Linux / macOS)
        - Other
    validations:
      required: true

  - type: input
    id: screen
    attributes:
      label: Screen
      description: Brand/model and resolution, and how it's connected (HDMI, DSI, round, portrait…)
      placeholder: 7" HDMI 1024×600, USB touch

  - type: input
    id: version
    attributes:
      label: SpotiScherm version
      description: Shown under Settings → Info
      placeholder: "1.1"

  - type: checkboxes
    id: settings
    attributes:
      label: Settings in config.env
      options:
        - label: SPOTISCHERM_FRAMEBUFFER=1
        - label: SPOTISCHERM_ZUINIG=1
        - label: DRAAIEN is not 0 (rotated screen)

  - type: textarea
    id: log
    attributes:
      label: Log
      description: Output of `journalctl -u spotischerm -n 50 --no-pager`. Check that it contains no keys or passwords.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not paste my Spotify Client ID/Secret, my `.spotify-cache` or my Wi-Fi password
          required: true
